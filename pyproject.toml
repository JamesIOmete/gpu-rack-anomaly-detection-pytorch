[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-rack-anomaly-detection-pytorch"
version = "0.1.0"
description = "Public-safe PyTorch project scaffold for GPU rack telemetry anomaly detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

ml = [
    "numpy>=1.26",
    "torch>=2.2",
]


[project.scripts]
gpu-rack-simulate = "gpu_rack_anomaly.simulate_telemetry:main"
gpu-rack-train = "gpu_rack_anomaly.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
